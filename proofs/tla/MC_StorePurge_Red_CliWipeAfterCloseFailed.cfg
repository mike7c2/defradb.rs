\* RED: the CLI only warns when the database does not close and goes on to
\* wipe and restart, as run.rs did before. Must fail
\* INV_NoRestartAfterFailedTeardown.
SPECIFICATION Spec
CONSTANTS
  Paths    = {"Cli"}
  Stores   = {"Persistent"}
  Veras    = {"None"}
  Handlers = {TRUE}
  HeldElsewhere = {FALSE}
  OtherCallers  = {FALSE}
  WipeAfterClose           = TRUE
  WaitVera                 = TRUE
  OpenAfterWipe            = TRUE
  ShutdownOutsideRequest   = TRUE
  HandlerChecked           = TRUE
  GateOnce                 = TRUE
  NoRestartAfterFailedWipe = TRUE
  KeyringExcluded          = TRUE
  MemoryRemovesOwnedDirs   = TRUE
  CliChecksVeraStop        = TRUE
  CliChecksClose           = FALSE
  LastHandleChecked        = TRUE
  ShutdownOnce             = TRUE
INVARIANT INV_NoRestartAfterFailedTeardown
CHECK_DEADLOCK FALSE
