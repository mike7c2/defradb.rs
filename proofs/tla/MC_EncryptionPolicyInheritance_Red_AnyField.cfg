\* RED: rule (c) asks for any encrypted field instead of every field. On a
\* document with one encrypted and one plaintext field, a new field gets the
\* document key though the document is not wholly encrypted
\* (INV_HeadlessAllEncrypted).
SPECIFICATION Spec
CONSTANTS
  Fields = {"f1", "f2", "f3"}
  Tear = "f2"
  MaxWrites = 1
  MaxReqWrites = 1
  MaxMerges = 0
  KeepCompositeLink = FALSE
  AnyField = TRUE
  PlainHeadedDocKey = FALSE
  PlainHeadWins = FALSE
  Vacuous = FALSE
  UsePrepared = TRUE
  UsePending = TRUE
  TornSnapshot = FALSE
INVARIANT INV_HeadlessAllEncrypted
CHECK_DEADLOCK FALSE
