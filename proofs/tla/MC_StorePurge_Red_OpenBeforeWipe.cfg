\* RED: the node starts again before its wipe ran, so it opens the old store
\* and the wipe never comes. Must fail INV_NoOpenBeforeWipe.
SPECIFICATION Spec
CONSTANTS
  Paths    = {"Embedded"}
  Stores   = {"Persistent"}
  Veras    = {"None"}
  Handlers = {TRUE}
  WipeAfterClose           = TRUE
  WaitVera                 = TRUE
  OpenAfterWipe            = FALSE
  ShutdownOutsideRequest   = TRUE
  HandlerChecked           = TRUE
  GateOnce                 = TRUE
  NoRestartAfterFailedWipe = TRUE
  KeyringExcluded          = TRUE
  MemoryRemovesOwnedDirs   = TRUE
  CliChecksVeraStop        = TRUE
  CliChecksClose           = TRUE
INVARIANT INV_NoOpenBeforeWipe
CHECK_DEADLOCK FALSE
