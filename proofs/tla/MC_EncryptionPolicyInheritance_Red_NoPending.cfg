\* RED: a preparation reads only the committed heads and ignores the fields
\* the request's earlier writes prepared (written_fields dropped). On an empty
\* document, one request creates f1 with an encryption config and then
\* updates f2 with none: the update's preparation sees no field at all, so f2
\* is written in plaintext though, in the request's order, the document is
\* wholly encrypted when f2 is written (INV_SeesRequestWrites).
SPECIFICATION Spec
CONSTANTS
  Fields = {"f1", "f2", "f3"}
  Tear = "f2"
  MaxWrites = 2
  MaxReqWrites = 2
  MaxMerges = 0
  KeepCompositeLink = FALSE
  AnyField = FALSE
  PlainHeadedDocKey = FALSE
  PlainHeadWins = FALSE
  Vacuous = FALSE
  UsePrepared = TRUE
  UsePending = FALSE
  TornSnapshot = FALSE
INVARIANT INV_SeesRequestWrites
CHECK_DEADLOCK FALSE
