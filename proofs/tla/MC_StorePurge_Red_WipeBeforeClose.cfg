\* RED: the wipe runs once the Vera node stopped but before the database
\* closed, so drop_all races the open store. Must fail INV_NoWipeWhileOpen.
SPECIFICATION Spec
CONSTANTS
  Paths    = {"Embedded"}
  Stores   = {"Persistent"}
  Veras    = {"None"}
  Handlers = {TRUE}
  WipeAfterClose           = FALSE
  WaitVera                 = TRUE
  OpenAfterWipe            = TRUE
  ShutdownOutsideRequest   = TRUE
  HandlerChecked           = TRUE
  GateOnce                 = TRUE
  NoRestartAfterFailedWipe = TRUE
  KeyringExcluded          = TRUE
  MemoryRemovesOwnedDirs   = TRUE
  CliChecksVeraStop        = TRUE
  CliChecksClose           = TRUE
INVARIANT INV_NoWipeWhileOpen
CHECK_DEADLOCK FALSE
