\* GREEN: the code as it is. Two local writes, in one request or two, and two
\* remote merges, of either kind, on any starting document: every decision
\* follows the rule, rests on heads the document really held plus the
\* request's earlier writes, and needs only minted keys.
SPECIFICATION Spec
CONSTANTS
  Fields = {"f1", "f2", "f3"}
  Tear = "f2"
  MaxWrites = 2
  MaxReqWrites = 2
  MaxMerges = 2
  KeepCompositeLink = FALSE
  AnyField = FALSE
  PlainHeadedDocKey = FALSE
  PlainHeadWins = FALSE
  Vacuous = FALSE
  UsePrepared = TRUE
  UsePending = TRUE
  TornSnapshot = FALSE
INVARIANT TypeOK INV_FollowsOwnHeads INV_NoDowngradeOfEncryptedField INV_HeadlessAllEncrypted INV_StaleDecisionSerializable INV_SeesRequestWrites INV_PreparedKeyCovers INV_CompositeUnlinked
CHECK_DEADLOCK FALSE
