\* RED: progress from another format resumes as is. The old build walks d1 and
\* crashes; the new build takes over the owed reindex, skips d1 and opens with
\* d1's entry in the old format, which it cannot read (INV_OpenReadable).
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2}
  MaxFormat = 2
  MaxRestarts = 3
  FormatReset = "Off"
INVARIANT INV_OpenReadable
CHECK_DEADLOCK FALSE
