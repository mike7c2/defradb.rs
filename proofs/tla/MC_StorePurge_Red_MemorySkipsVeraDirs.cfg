\* RED: a memory store removes no directory, so the embedded Vera node
\* restarts on its old chain. Must fail INV_NothingSurvives.
SPECIFICATION Spec
CONSTANTS
  Paths    = {"Cli"}
  Stores   = {"Memory"}
  Veras    = {"Embedded"}
  Handlers = {TRUE}
  WipeAfterClose           = TRUE
  WaitVera                 = TRUE
  OpenAfterWipe            = TRUE
  ShutdownOutsideRequest   = TRUE
  HandlerChecked           = TRUE
  GateOnce                 = TRUE
  NoRestartAfterFailedWipe = TRUE
  KeyringExcluded          = TRUE
  MemoryRemovesOwnedDirs   = FALSE
  CliChecksVeraStop        = TRUE
  CliChecksClose           = TRUE
INVARIANT INV_NothingSurvives
CHECK_DEADLOCK FALSE
