\* GREEN: the race under a unique index where a client may write nil. Nil is
\* never checked (its entry key carries the DocID), so writers of nil are
\* never refused, while two writers of "v" still race. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  Clients = {1, 2}
  Values = {"nil", "v"}
  Mode = "Explicit"
  Indexed = TRUE
  EntryValidated = TRUE
  ScanDecides = FALSE
  LoserLeaves = FALSE
  RerunReuses = FALSE
  NilChecked = FALSE
  MaxAttempts = 3
INVARIANT TypeOK
INVARIANT INV_AtMostOnePerNonNilValue
INVARIANT INV_LoserLeavesNothing
INVARIANT INV_LoserRefusedTyped
INVARIANT INV_NoIndexNotRefused
INVARIANT INV_NilNotRefused
CHECK_DEADLOCK FALSE
