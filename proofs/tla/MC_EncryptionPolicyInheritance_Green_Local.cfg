\* GREEN: local writes only, no merges. Here "every field encrypted" does
\* stay true once it is true (PROP_EncryptedMonotone), and every invariant holds.
SPECIFICATION Spec
CONSTANTS
  Fields = {"f1", "f2", "f3"}
  Tear = "f2"
  MaxWrites = 3
  MaxMerges = 0
  KeepCompositeLink = FALSE
  AnyField = FALSE
  PlainHeadedDocKey = FALSE
  PlainHeadWins = FALSE
  Vacuous = FALSE
  UsePrepared = TRUE
  TornSnapshot = FALSE
INVARIANT TypeOK INV_FollowsOwnHeads INV_NoDowngradeOfEncryptedField INV_HeadlessAllEncrypted INV_StaleDecisionSerializable INV_PreparedKeyCovers INV_CompositeUnlinked
PROPERTY PROP_EncryptedMonotone
CHECK_DEADLOCK FALSE
