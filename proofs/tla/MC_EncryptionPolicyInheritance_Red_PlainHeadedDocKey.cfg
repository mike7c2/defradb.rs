\* RED: a field whose heads are all plaintext takes the document key when
\* another field is encrypted, as the old composite fallback did: it ignores
\* its own heads and differs from Go (INV_FollowsOwnHeads).
SPECIFICATION Spec
CONSTANTS
  Fields = {"f1", "f2", "f3"}
  Tear = "f2"
  MaxWrites = 1
  MaxMerges = 0
  KeepCompositeLink = FALSE
  AnyField = FALSE
  PlainHeadedDocKey = TRUE
  PlainHeadWins = FALSE
  Vacuous = FALSE
  UsePrepared = TRUE
  TornSnapshot = FALSE
INVARIANT INV_FollowsOwnHeads
CHECK_DEADLOCK FALSE
