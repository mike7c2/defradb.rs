\* RED: a wipe that failed part way is ignored and the node starts again
\* over what is left. Must fail INV_NoRestartAfterFailedTeardown.
SPECIFICATION Spec
CONSTANTS
  Paths    = {"Embedded"}
  Stores   = {"Persistent"}
  Veras    = {"None"}
  Handlers = {TRUE}
  WipeAfterClose           = TRUE
  WaitVera                 = TRUE
  OpenAfterWipe            = TRUE
  ShutdownOutsideRequest   = TRUE
  HandlerChecked           = TRUE
  GateOnce                 = TRUE
  NoRestartAfterFailedWipe = FALSE
  KeyringExcluded          = TRUE
  MemoryRemovesOwnedDirs   = TRUE
  CliChecksVeraStop        = TRUE
  CliChecksClose           = TRUE
INVARIANT INV_NoRestartAfterFailedTeardown
CHECK_DEADLOCK FALSE
