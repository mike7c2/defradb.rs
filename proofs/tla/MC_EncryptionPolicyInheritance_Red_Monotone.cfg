\* RED: asserts the false premise that "every field encrypted" only grows.
\* A remote plaintext block for a field with no heads breaks it
\* (PROP_EncryptedMonotone), which is why the decision rests on
\* serializability, not on monotonicity.
SPECIFICATION Spec
CONSTANTS
  Fields = {"f1", "f2", "f3"}
  Tear = "f2"
  MaxWrites = 0
  MaxMerges = 1
  KeepCompositeLink = FALSE
  AnyField = FALSE
  PlainHeadedDocKey = FALSE
  PlainHeadWins = FALSE
  Vacuous = FALSE
  UsePrepared = TRUE
  TornSnapshot = FALSE
PROPERTY PROP_EncryptedMonotone
CHECK_DEADLOCK FALSE
