\* RED: the builder decides rule (c) again on the heads it reads, not the
\* preparation's decision. A remote encrypted block lands between the two, the
\* builder now wants the document key, and the preparation never minted it
\* (INV_PreparedKeyCovers).
SPECIFICATION Spec
CONSTANTS
  Fields = {"f1", "f2", "f3"}
  Tear = "f2"
  MaxWrites = 1
  MaxReqWrites = 1
  MaxMerges = 1
  KeepCompositeLink = FALSE
  AnyField = FALSE
  PlainHeadedDocKey = FALSE
  PlainHeadWins = FALSE
  Vacuous = FALSE
  UsePrepared = FALSE
  UsePending = TRUE
  TornSnapshot = FALSE
INVARIANT INV_PreparedKeyCovers
CHECK_DEADLOCK FALSE
