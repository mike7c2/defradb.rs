\* RED: the wipe runs before the Vera node is stopped, so its directories
\* are removed while it still writes them. Must fail INV_NoWipeWhileOpen.
SPECIFICATION Spec
CONSTANTS
  Paths    = {"Embedded"}
  Stores   = {"Persistent"}
  Veras    = {"Embedded"}
  Handlers = {TRUE}
  WipeAfterClose           = TRUE
  WaitVera                 = FALSE
  OpenAfterWipe            = TRUE
  ShutdownOutsideRequest   = TRUE
  HandlerChecked           = TRUE
  GateOnce                 = TRUE
  NoRestartAfterFailedWipe = TRUE
  KeyringExcluded          = TRUE
  MemoryRemovesOwnedDirs   = TRUE
  CliChecksVeraStop        = TRUE
  CliChecksClose           = TRUE
INVARIANT INV_NoWipeWhileOpen
CHECK_DEADLOCK FALSE
